<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/NatureInstinct.ico" />
    <link rel="stylesheet" href="/style.css" />

    <title>Nature Instinct</title>
  </head>
  <body>
    <header>
      <!-- LOGO ASSOCIATION -->
      <img
        src="/images/LogoNatureInstinct.png"
        alt="Logo de l'association Nature Instinct"
        id="logo"
      />
      <!-- NAVBAR -->
      <nav>
        <ul>
          <li><a href="/index.html">Accueil</a></li>
          <li><a href="/activities.html">Activités</a></li>
          <li><a href="/actualities.html">Actualités</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- Formulaire de contact -->
    <section id="form">
      <form method="post" name="contact">
        <fieldset>
          <label for="name">Nom :</label>
          <input
            id="name"
            type="text"
            name="name"
            placeholder="Entrez votre nom"
            required
          />
        </fieldset>
        <br />

        <fieldset>
          <label for="prenom">Prénom :</label>
          <input
            id="prenom"
            type="text"
            name="prenom"
            placeholder="Entrez votre prénom"
            required
          />
        </fieldset>
        <br />

        <fieldset>
          <label for="email">Email :</label>
          <input
            id="email"
            type="email"
            id="email"
            name="email"
            placeholder="exemple@exemple.com"
            required
          />
        </fieldset>
        <br />

        <!-- Message -->
        <fieldset>
          <legend id="message">Votre message :</legend>
          <textarea
            name="message"
            rows="4"
            cols="50"
            placeholder="Saisissez votre message"
            required
          ></textarea>
        </fieldset>
        <br />

        <!-- Checkbox -->
        <fieldset id="checkbox">
          <h3>Vos disponibilités pour l'association :</h3>
          <input id="lundi" type="checkbox" />
          <label for="lundi">Lundi</label>
          <input id="mardi" type="checkbox" />
          <label for="mardi">Mardi</label>
          <input id="mercredi" type="checkbox" />
          <label for="mercredi">Mercredi</label>
          <input id="jeudi" type="checkbox" />
          <label for="jeudi">Jeudi</label>
          <input id="vendredi" type="checkbox" />
          <label for="vendredi">Vendredi</label>
          <input id="samedi" type="checkbox" />
          <label for="samedi">Samedi</label>
          <input id="dimanche" type="checkbox" />
          <label for="dimanche">dimanche</label>
        </fieldset>

        <input type="submit" value="Envoyer" id="send" />
        <input type="reset" value="Reset" id="reset" />
      </form>
    </section>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 Nature Instinct – Ensemble, on est plusieurs</p>
      <a href="#">
        <img src="/images/logo-facebook.png" alt="Logo Facebook" />
      </a>
      <a href="#">
        <img src="/images/Instagram_icon.png.webp" alt="Logo Instagram" />
      </a>
    </footer>
  </body>
</html>
